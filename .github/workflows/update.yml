name: Ancienne collecte collective PoPsEDT (manuelle)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: polytech-calendar-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6
      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Vérifier le générateur sans réseau
        run: python -m unittest discover -s tests -v
      - name: Générer tous les calendriers APP3
        run: |
          if python -u generate_ics.py; then
            echo "### Collecte PoPsEDT et génération réussies" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Génération interrompue. Consultez les erreurs PoPsEDT ci-dessus. Aucun calendrier n'est envoyé ni publié."
            echo "### Échec de la collecte ou de la génération" >> "$GITHUB_STEP_SUMMARY"
            echo "Les calendriers déjà publiés restent disponibles ; leur contenu peut être ancien. Consulter les logs de cette étape." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Sauvegarder les calendriers modifiés
        run: |
          git config user.name "Polytech Calendar Bot"
          git config user.email "polytech-calendar@users.noreply.github.com"
          git add docs/calendars docs/edt.ics
          if git diff --cached --quiet; then
            echo "Aucune modification de l'emploi du temps"
          else
            git commit -m "Mise à jour des calendriers APP3"
            git push origin HEAD:main
          fi
      - name: Préparer GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    concurrency:
      group: polytech-calendar-pages
      cancel-in-progress: false
    needs: update
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier les calendriers sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
