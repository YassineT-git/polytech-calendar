name: Mise à jour EDT Polytech APP3

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

  push:
    branches:
      - main
    paths:
      - "generate_ics.py"
      - "docs/index.html"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: polytech-calendar-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Générer tous les calendriers APP3
        run: python generate_ics.py

      - name: Sauvegarder les calendriers modifiés
        run: |
          git config user.name "Polytech Calendar Bot"
          git config user.email "polytech-calendar@users.noreply.github.com"

          git add docs/calendars docs/edt.ics

          if git diff --cached --quiet; then
            echo "Aucune modification de l'emploi du temps"
          else
            git commit -m "Mise à jour des calendriers APP3"
            git push
          fi
